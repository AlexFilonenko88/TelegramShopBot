[project]
name = "telegram-shop-bot"
version = "0.1.0"
description = "Telegram-бот для продажи цифровых товаров (aiogram 3.x)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram>=3.15.0,<4.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "aiohttp>=3.11.0,<4.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"
black = ">=24.10.0"
ruff = ">=0.8.0"

[tool.black]
line-length = 80
target-version = ["py314"]

[tool.ruff]
line-length = 80
target-version = "py314"
src = ["bot", "db", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # B008: вызов Depends() в дефолтах аргументов — идиоматика aiogram 3.x.
    "B008",
    # RUF001/RUF002/RUF003: «похожие на латиницу» буквы в кириллице —
    # сплошные ложные срабатывания: строки и комментарии на русском.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# config.py не правится (см. CLAUDE.md): допускаем его длинные строки
# и явные кавычки в аннотациях.
"config.py" = ["E501", "UP037"]
# Миграции генерирует Alembic — их формат не контролируем вручную.
"db/migrations/versions/*" = ["E501", "N999", "I001", "F401", "UP035", "UP037"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: тесты на реальном PostgreSQL (пропускаются без БД)",
]
